<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUMBO X SPOTIFY | Edición Especial</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --borgona: #4A0818;
      --borgona-oscuro: #23020A;
      --amarillo: #FFD100;
      --crema: #FFF8E7;
      --spotify: #1DB954;
      --choco-leche: #5C3217;
      --choco-blanco: #F5E6CC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--borgona-oscuro);
      background-image: 
        radial-gradient(var(--amarillo) 1px, transparent 1px),
        radial-gradient(rgba(255, 209, 0, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: var(--crema);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: "JUMBO ★ SPOTIFY ★ JUMBO ★ SPOTIFY ★";
      position: absolute;
      top: 10px;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: var(--amarillo);
      opacity: 0.25;
      font-weight: 800;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 2;
    }

    .badge-awoo {
      background: var(--amarillo);
      color: var(--borgona-oscuro);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-block;
      margin-bottom: 6px;
      box-shadow: 0 2px 10px rgba(255,209,0,0.4);
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 2.5rem;
      color: var(--amarillo);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0px #000;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      background: rgba(35, 2, 10, 0.92);
      border: 3px solid var(--amarillo);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      z-index: 2;
    }

    /* Simulador de la Chocolatina con Relieve */
    .chocolatina-3d {
      width: 100%;
      height: 160px;
      background: var(--choco-leche);
      border-radius: 14px;
      border: 4px solid #1a0b04;
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      padding: 8px;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.6), 0 8px 20px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      transition: background 0.4s ease;
    }

    .porcion-chocolate {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      border-top: 2px solid rgba(255,255,255,0.15);
      border-left: 2px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .placa-central {
      position: absolute;
      top: 20%;
      left: 10%;
      right: 10%;
      bottom: 20%;
      background: inherit;
      border: 2px solid rgba(0,0,0,0.4);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.6), 0 2px 4px rgba(255,255,255,0.15);
    }

    .texto-placa {
      font-family: 'Anton', sans-serif;
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 -1px 1px rgba(255,255,255,0.2);
      text-align: center;
    }

    .subtexto-placa {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: var(--amarillo);
      font-weight: 800;
      margin-top: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .paso {
      margin-bottom: 18px;
    }

    .paso-titulo {
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--amarillo);
      margin-bottom: 8px;
    }

    .opciones-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button.opcion-base, button.opcion-topping {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: var(--crema);
      padding: 10px 6px;
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    button.opcion-base.activo, button.opcion-topping.activo {
      background: var(--amarillo);
      color: var(--borgona-oscuro);
      border-color: var(--amarillo);
      font-weight: 800;
      transform: scale(1.03);
    }

    .icono-topping {
      font-size: 1.2rem;
    }

    input[type="text"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid rgba(255, 209, 0, 0.4);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--amarillo);
    }

    .btn-principal {
      width: 100%;
      background: var(--amarillo);
      color: var(--borgona-oscuro);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 5px 0 #b89600;
      margin-top: 5px;
    }

    .btn-principal:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b89600;
    }

    #tarjeta-resultado {
      display: none;
      margin-top: 20px;
      background: linear-gradient(145deg, #3d0512, #180106);
      border: 3px solid var(--amarillo);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
    }

    .frase-sonora {
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      color: var(--amarillo);
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .dedicatoria-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 10px;
      font-style: italic;
      font-size: 0.85rem;
      margin-bottom: 12px;
      border-left: 3px solid var(--amarillo);
    }

    .spotify-code-container {
      background: #121212;
      border: 1px solid var(--spotify);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .spotify-code-img {
      width: 100%;
      max-width: 200px;
      height: auto;
      filter: drop-shadow(0 0 2px rgba(29, 185, 84, 0.4));
    }

    .acciones-envio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-secundario {
      background: transparent;
      border: 1.5px solid var(--amarillo);
      color: var(--amarillo);
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge-awoo">Collab Exclusiva</span>
    <h1>Jumbo x Spotify</h1>
  </header>

  <main class="contenedor">
    <!-- Visualizador Real de la Chocolatina con Bajo Relieve -->
    <div class="chocolatina-3d" id="chocolatinaVisual">
      <div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div>
      <div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div>
      <div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div><div class="porcion-chocolate"></div>
      
      <div class="placa-central">
        <div class="texto-placa">JUMBO X SPOTIFY</div>
        <div class="subtexto-placa" id="subtextoBase">CHOCOLATE DE LECHE</div>
      </div>
    </div>

    <!-- Paso 1: Base de la Chocolatina -->
    <div class="paso">
      <div class="paso-titulo">1. Elige tu base de chocolate</div>
      <div class="opciones-grid" style="grid-template-columns: 1fr 1fr;">
        <button type="button" class="opcion-base activo" id="btnLeche" onclick="seleccionarBase('leche')">🍫 Leche</button>
        <button type="button" class="opcion-base" id="btnBlanco" onclick="seleccionarBase('blanco')">🤍 Blanco</button>
      </div>
    </div>

    <!-- Paso 2: Toppings con Iconos (Maní ahora opcional) -->
    <div class="paso">
      <div class="paso-titulo">2. Elige tus Toppings</div>
      <div class="opciones-grid">
        <button type="button" class="opcion-topping" id="topMani" onclick="toggleTopping('Maní', this)">
          <span class="icono-topping">🥜</span> Maní
        </button>
        <button type="button" class="opcion-topping" id="topOreo" onclick="toggleTopping('Oreo', this)">
          <span class="icono-topping">🍪</span> Oreo
        </button>
        <button type="button" class="opcion-topping" id="topBrownie" onclick="toggleTopping('Brownie', this)">
          <span class="icono-topping">🍫</span> Brownie
        </button>
      </div>
    </div>

    <!-- Paso 3: Canción con Recomendaciones + Escritura Libre -->
    <div class="paso">
      <div class="paso-titulo">3. Elige o escribe una canción</div>
      <select id="selectCancion" onchange="seleccionarSugerencia(this)">
        <option value="">-- Elige una recomendación de Ryan Castro --</option>
        <option value="Jordan|https://open.spotify.com/track/6Z8R6FR4GXCCKBp5WwP0M5">Jordan - Ryan Castro</option>
        <option value="Una Cita (Remix)|https://open.spotify.com/track/15X3K9n2xXW0P9C3wYt0c3">Una Cita (Remix) - Ryan Castro</option>
        <option value="Monastery|https://open.spotify.com/track/307a5EwEhn5m6h42U95bXh">Monastery - Ryan Castro</option>
        <option value="El Cantante del Ghetto|https://open.spotify.com/track/4jVv4Y51T9qW00J2F4F7z0">El Cantante del Ghetto - Ryan Castro</option>
      </select>
      <input type="text" id="inputCancionLibre" placeholder="O escribe otra canción o artista aquí..." maxlength="45" />
    </div>

    <!-- Paso 4: Datos del Usuario -->
    <div class="paso">
      <input type="text" id="nombreUsuario" placeholder="Tu nombre..." maxlength="25" />
      <input type="text" id="fraseDedicatoria" placeholder="Escribe una frase para recordar..." maxlength="100" />
    </div>

    <button type="button" class="btn-principal" onclick="generarExperiencia()">Generar mi Tarjeta</button>

    <!-- Resultado Final -->
    <section id="tarjeta-resultado">
      <div class="frase-sonora" id="tituloFinal">EL FLOW ÚNICO DE DANIELA</div>
      
      <div class="dedicatoria-box" id="textoDedicatoriaFinal">
        "Una combinación con todo el estilo."
      </div>

      <div class="spotify-code-container">
        <div style="font-size: 0.75rem; color: #b3b3b3; display:flex; align-items:center; gap:6px;">
          <span>🟢</span> Escanea con la cámara de Spotify
        </div>
        <img id="imagenSpotifyCode" class="spotify-code-img" src="" alt="Spotify Code" />
        <div style="font-size: 0.8rem; font-weight: bold; color: #fff;" id="nombreCancionFinal">Jordan - Ryan Castro</div>
      </div>

      <div class="acciones-envio">
        <button type="button" class="btn-secundario" onclick="enviarCorreo()">✉️ Enviar Correo</button>
        <button type="button" class="btn-secundario" onclick="compartirAirDrop()">📲 Compartir / AirDrop</button>
      </div>
    </section>
  </main>

  <script>
    let baseActual = 'leche';
    let toppingsSeleccionados = [];
    let linkSpotifySeleccionado = 'https://open.spotify.com/track/6Z8R6FR4GXCCKBp5WwP0M5'; // Por defecto Jordan

    // Sintetizador de audio melódico y duradero (Arpegio suave tipo teclado)
    function tocarAcordeMelodico() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        const frecuencias = [261.63, 329.63, 392.00, 523.25]; // Acorde armonioso (C major)
        frecuencias.forEach((freq, index) => {
          setTimeout(() => {
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.55);
          }, index * 90);
        });
      } catch (e) {
        console.log('Audio contextual bloqueado o no soportado');
      }
    }

    function seleccionarBase(tipo) {
      baseActual = tipo;
      tocarAcordeMelodico();

      const btnLeche = document.getElementById('btnLeche');
      const btnBlanco = document.getElementById('btnBlanco');
      const chocolatina = document.getElementById('chocolatinaVisual');
      const subtexto = document.getElementById('subtextoBase');

      if (tipo === 'leche') {
        btnLeche.classList.add('activo');
        btnBlanco.classList.remove('activo');
        chocolatina.style.background = 'var(--choco-leche)';
        chocolatina.style.color = '#fff';
        subtexto.innerText = 'CHOCOLATE DE LECHE';
      } else {
        btnBlanco.classList.add('activo');
        btnLeche.classList.remove('activo');
        chocolatina.style.background = 'var(--choco-blanco)';
        chocolatina.style.color = '#221208';
        subtexto.innerText = 'CHOCOLATE BLANCO';
      }
    }

    function toggleTopping(nombre, btn) {
      tocarAcordeMelodico();
      btn.classList.toggle('activo');
      if (toppingsSeleccionados.includes(nombre)) {
        toppingsSeleccionados = toppingsSeleccionados.filter(t => t !== nombre);
      } else {
        toppingsSeleccionados.push(nombre);
      }
    }

    function seleccionarSugerencia(select) {
      if (!select.value) return;
      tocarAcordeMelodico();
      const partes = select.value.split('|');
      const nombreCancion = partes[0];
      linkSpotifySeleccionado = partes[1];
      
      // Llena automáticamente el input libre para que sepas qué canción quedó seleccionada
      document.getElementById('inputCancionLibre').value = nombreCancion;
    }

    function generarExperiencia() {
      tocarAcordeMelodico();
      const nombre = document.getElementById('nombreUsuario').value.trim() || 'Awoo Fan';
      const frase = document.getElementById('fraseDedicatoria').value.trim() || 'Un momento dulce con todo el flow.';
      const cancionLibre = document.getElementById('inputCancionLibre').value.trim();
      
      const nombreFinalCancion = cancionLibre !== '' ? cancionLibre : 'Jordan - Ryan Castro';

      // Generador oficial de códigos de Spotify
      const spotifyCodeUrl = `https://scannables.scdn.co/uri/plain/jpeg/1280/black/white/600/${encodeURIComponent(linkSpotifySeleccionado)}`;

      document.getElementById('tituloFinal').innerText = `El flow único de ${nombre}`;
      document.getElementById('textoDedicatoriaFinal').innerText = `"${frase}"`;
      document.getElementById('nombreCancionFinal').innerText = nombreFinalCancion;
      document.getElementById('imagenSpotifyCode').src = spotifyCodeUrl;

      document.getElementById('tarjeta-resultado').style.display = 'block';
      document.getElementById('tarjeta-resultado').scrollIntoView({ behavior: 'smooth' });
    }

    function enviarCorreo() {
      const titulo = document.getElementById('tituloFinal').innerText;
      const frase = document.getElementById('textoDedicatoriaFinal').innerText;
      const cancion = document.getElementById('nombreCancionFinal').innerText;

      const asunto = encodeURIComponent(`🍫 Mi Creación Exclusiva Jumbo x Spotify`);
      const cuerpo = encodeURIComponent(`${titulo}\n\nDedicatoria: ${frase}\nCanción: ${cancion}`);
      window.location.href = `mailto:?subject=${asunto}&body=${cuerpo}`;
    }

    async function compartirAirDrop() {
      const titulo = document.getElementById('tituloFinal').innerText;
      const frase = document.getElementById('textoDedicatoriaFinal').innerText;
      const textoCompartir = `${titulo} 🍫🔥 ${frase} — JUMBO x SPOTIFY`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Mi Chocolatina Jumbo',
            text: textoCompartir,
            url: window.location.href
          });
        } catch (err) {
          console.log('Compartir cancelado');
        }
      } else {
        alert('En iPhone, este botón abre directamente AirDrop. Contenido copiado.');
      }
    }
  </script>
</body>
</html>
